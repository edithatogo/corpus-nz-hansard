[project]
name = "corpus-nz-hansard"
version = "0.1.0"
description = "Document-level New Zealand Hansard corpus release tooling."
requires-python = ">=3.14"
dependencies = [
  "duckdb==1.5.4",
  "huggingface-hub>=1.20.1",
  "jsonschema>=4.26.0",
  "loguru>=0.7.3",
  "pdfplumber>=0.11.10",
  "polars>=1.41.2",
  "pypdf>=6.13.3",
  "pyarrow>=24.0.0",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
  "requests>=2.34.2",
]

[project.scripts]
corpus-nz-hansard = "scripts.cli:main"
nz-hansard-corpus = "scripts.cli:main"

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-github-actions-annotate-failures==0.4.2",
  "pytest-randomly==4.1.0",
  "pytest-timeout==2.4.0",
  "pytest-xdist==3.8.0",
  "ruff==0.15.18",
  "taplo==0.9.3",
  "ty==0.0.51",
  "typos==1.47.2",
  "zizmor==1.26.1",
  "hypothesis==6.155.7",
  "scalene==2.3.0",
  "pre-commit==4.6.0",
]
embeddings = ["FlagEmbedding>=1.4.0", "torch>=2.12.1", "transformers>=5.12.1"]
rdf = ["rdflib>=7.6.0"]
nlp = ["scikit-learn>=1.9.0"]
ai = ["pydantic-ai-slim==1.107.0"]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [
  ".git",
  ".test-tmp",
  ".tmp",
  "generated",
  "*.mjs",
  "scripts/committee_common.py",
  "scripts/select_committee_reports/_gen.py",
  "scripts/test_replace.py",
]

