  "E402",
]
"scripts/*" = [
  "INP001",
  "ANN001",
  "ANN201",
  "T20",
  "PERF",
  "EM",
  "TRY",
  "PLR0912",
  "F401",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.coverage.run]
source = ["scripts"]
omit = ["*/tests/*"]
branch = true

[tool.coverage.report]
fail_under = 60
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]
markers = [
  "unit: Fast mock-isolated unit tests",
  "integration: Cross-component integration tests",
  "smoke: CLI smoke tests that exercise the full toolchain",
  "hypothesis: Property-based tests using Hypothesis",
]

[tool.ty.environment]
root = ["."]
python-version = "3.14"

[tool.ty.rules]
all = "error"

[tool.scalene]
cpu = true
gpu = false
memory = true
profile_all = false
reduced_profile = true

[tool.legal_nz]
versioning = "semver"
logging = "loguru"
