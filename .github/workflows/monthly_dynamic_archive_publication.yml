name: Monthly Dynamic Archive Publication

on:
  schedule:
    # Run at 03:17 UTC on the first day of each month.
    - cron: "17 3 1 * *"
  workflow_dispatch:
    inputs:
      publication_mode:
        description: "Publication mode"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - huggingface
          - zenodo-draft
          - full
      version:
        description: "Archive version or monthly label"
        required: true
        default: "0.1.0"
      hf_repo_id:
        description: "Target Hugging Face dataset repo"
        required: true
        default: "edithatogo/nz-hansard-corpus"
      hf_private:
        description: "Create/update Hugging Face dataset as private"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      zenodo_api_url:
        description: "Zenodo API URL"
        required: true
        default: "https://zenodo.org/api"
      existing_deposition_id:
        description: "Existing Zenodo record/deposition id to version from"
        required: false
        default: "20595194"
      create_new_version:
        description: "Create a new Zenodo draft version from existing_deposition_id"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  monthly-archive:
    runs-on: windows-2025-vs2026
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      # actions/setup-python v6.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14"
      - name: Resolve publication mode
        shell: pwsh
        run: |
          $mode = "${{ github.event.inputs.publication_mode }}"
          if (-not $mode) {
            $mode = "dry-run"
          }
          "PUBLICATION_MODE=$mode" | Out-File -FilePath $env:GITHUB_ENV -Append
          "Monthly archive publication mode: $mode"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt huggingface_hub[hf_xet]
      - name: Check required secrets
        shell: pwsh
        env:
          SOURCE_ARCHIVE_URL: ${{ secrets.SOURCE_ARCHIVE_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ARCHIVE_CREATORS_JSON: ${{ secrets.ARCHIVE_CREATORS_JSON }}
        run: |
          if (-not "$env:SOURCE_ARCHIVE_URL") {
            throw "SOURCE_ARCHIVE_URL secret is required for monthly archive rebuilds."
          }
          if (-not "$env:HF_TOKEN") {
            throw "HF_TOKEN secret is required for source archive access and Hugging Face publication."
          }
          if ($env:PUBLICATION_MODE -in @("zenodo-draft", "full")) {
            if (-not "$env:ZENODO_TOKEN") {
              throw "ZENODO_TOKEN secret is required for Zenodo draft upload."
            }
            if (-not "$env:ARCHIVE_CREATORS_JSON") {
              throw "ARCHIVE_CREATORS_JSON secret is required for Zenodo metadata."
            }
          }
      - name: Download source archive
        env:
          SOURCE_ARCHIVE_URL: ${{ secrets.SOURCE_ARCHIVE_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts\fetch_source_archive.py
      - name: Rebuild normalized corpus artifacts
        run: |
          python scripts\inventory_archive.py --archive "2024-09-06 Hansard Extract from DocumentsDB.zip" --output manifests\source_inventory.json
          python scripts\discover_schema.py --archive "2024-09-06 Hansard Extract from DocumentsDB.zip" --output manifests\schema_discovery.json --sample-rows 5
          python scripts\normalize_hansard.py --archive "2024-09-06 Hansard Extract from DocumentsDB.zip" --output-dir generated\parquet --manifest manifests\normalization_manifest.json --validation manifests\normalization_validation.json --batch-size 1000
          python scripts\validate_hansard_records.py --parquet generated\parquet\hansard.parquet --schema schemas\hansard_record.schema.json --report manifests\record_schema_validation.json
      - name: Rebuild metadata packages
        run: |
          python scripts\build_metadata_packages.py
          python scripts\check_metadata_packages.py
      - name: Stage Hugging Face dataset
        run: python scripts\stage_huggingface_dataset.py --output-dir generated\huggingface
      - name: Build Zenodo archive
        env:
          ARCHIVE_VERSION: ${{ github.event.inputs.version || '0.1.0' }}
        run: python scripts\build_zenodo_archive.py --output-dir generated\zenodo --version "$env:ARCHIVE_VERSION"
      - name: Upload monthly archive artifacts
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: monthly-dynamic-archive-${{ github.run_id }}
          path: |
            generated/zenodo/*.tar.gz
            generated/zenodo/*.manifest.json
          if-no-files-found: error
      - name: Attest monthly archive provenance
        # actions/attest-build-provenance v4.1.0
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-path: |
            generated/zenodo/*.tar.gz
            generated/zenodo/*.manifest.json
      - name: Upload dataset to Hugging Face
        if: ${{ env.PUBLICATION_MODE == 'huggingface' || env.PUBLICATION_MODE == 'full' }}
        shell: pwsh
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ github.event.inputs.hf_repo_id || 'edithatogo/nz-hansard-corpus' }}
          HF_PRIVATE: ${{ github.event.inputs.hf_private || 'false' }}
          HF_XET_HIGH_PERFORMANCE: "1"
        run: |
          New-Item -ItemType Directory -Force -Path generated\monthly-publication | Out-Null
          $args = @(
            "scripts\upload_huggingface_dataset.py",
            "--repo-id", "$env:HF_REPO_ID",
            "--folder", "generated\huggingface",
            "--force"
          )
          if ($env:HF_PRIVATE -eq "true") {
            $args += "--private"
          }
          python @args | Tee-Object -FilePath generated\monthly-publication\huggingface-upload.json
      - name: Upload Zenodo draft
        if: ${{ env.PUBLICATION_MODE == 'zenodo-draft' || env.PUBLICATION_MODE == 'full' }}
        shell: pwsh
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ARCHIVE_CREATORS_JSON: ${{ secrets.ARCHIVE_CREATORS_JSON }}
          ZENODO_DEPOSITION_ID: ${{ github.event.inputs.existing_deposition_id || '20595194' }}
          ZENODO_API_URL: ${{ github.event.inputs.zenodo_api_url || 'https://zenodo.org/api' }}
          ARCHIVE_VERSION: ${{ github.event.inputs.version || '0.1.0' }}
          CREATE_NEW_VERSION: ${{ github.event.inputs.create_new_version || 'true' }}
        run: |
          New-Item -ItemType Directory -Force -Path generated\monthly-publication | Out-Null
          $args = @(
            "scripts\upload_zenodo_archive.py",
            "--archive", "generated\zenodo\nz-hansard-corpus-$env:ARCHIVE_VERSION.tar.gz",
            "--manifest", "generated\zenodo\nz-hansard-corpus-$env:ARCHIVE_VERSION.manifest.json",
            "--api-url", "$env:ZENODO_API_URL",
            "--version", "$env:ARCHIVE_VERSION"
          )
          if ($env:ZENODO_DEPOSITION_ID) {
            $args += @("--deposition-id", "$env:ZENODO_DEPOSITION_ID")
          }
          if ($env:CREATE_NEW_VERSION -eq "true") {
            $args += "--create-new-version"
          }
          python @args | Tee-Object -FilePath generated\monthly-publication\zenodo-draft-upload.json
      - name: Record protected Zenodo publish handoff
        if: ${{ env.PUBLICATION_MODE == 'full' }}
        shell: pwsh
        run: |
          "Zenodo draft upload complete. Publish the prepared draft through .github/workflows/zenodo_publish.yml and the zenodo-production-publish environment." | Tee-Object -FilePath generated\monthly-publication\zenodo-publish-handoff.txt
      - name: Build monthly release evidence
        shell: pwsh
        env:
          ARCHIVE_VERSION: ${{ github.event.inputs.version || '0.1.0' }}
          HF_REPO_ID: ${{ github.event.inputs.hf_repo_id || 'edithatogo/nz-hansard-corpus' }}
          ZENODO_API_URL: ${{ github.event.inputs.zenodo_api_url || 'https://zenodo.org/api' }}
        run: |
          New-Item -ItemType Directory -Force -Path generated\monthly-publication | Out-Null
          python scripts\build_monthly_dynamic_archive_evidence.py `
            --output manifests\monthly_dynamic_archive_publication_evidence.json `
            --archive "generated\zenodo\nz-hansard-corpus-$env:ARCHIVE_VERSION.tar.gz" `
            --archive-manifest "generated\zenodo\nz-hansard-corpus-$env:ARCHIVE_VERSION.manifest.json" `
            --record-validation manifests\record_schema_validation.json `
            --huggingface-result generated\monthly-publication\huggingface-upload.json `
            --zenodo-result generated\monthly-publication\zenodo-draft-upload.json
          Copy-Item manifests\monthly_dynamic_archive_publication_evidence.json generated\monthly-publication\monthly_dynamic_archive_publication_evidence.json
      - name: Upload monthly publication result artifacts
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: monthly-publication-results-${{ github.run_id }}
          path: generated/monthly-publication/*
          if-no-files-found: ignore
