name: Parliament Video Ongoing Archive

on:
  schedule:
    # Run every Sunday at 03:37 UTC.
    - cron: "37 3 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "Refresh mode"
        required: true
        default: "refresh"
        type: choice
        options:
          - dry-run
          - refresh

permissions:
  contents: read

jobs:
  ongoing-archive:
    runs-on: windows-2025-vs2026
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      # actions/setup-python v6.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14"

      - name: Install Pixi
        shell: pwsh
        run: |
          iwr -UseBasicParsing https://pixi.sh/install.ps1 | iex
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.pixi\bin"

      - name: Install dependencies
        run: pixi install

      - name: Build ongoing archive snapshot
        shell: pwsh
        env:
          REFRESH_MODE: ${{ github.event.inputs.mode || 'refresh' }}
        run: |
          if ($env:REFRESH_MODE -eq "dry-run") {
            pixi run python scripts\build_parliament_video_ongoing_archive.py --no-write
          } else {
            pixi run parliament-video-ongoing-archive
          }

      - name: Upload ongoing archive artifacts
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: parliament-video-ongoing-archive-${{ github.run_id }}
          path: |
            manifests/parliament_video_ongoing_archive.json
            docs/parliament-video-ongoing-archive.md
            derived/parliament_video_ongoing_archive/**
          if-no-files-found: error
