name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-2025-vs2026
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          lfs: true
          persist-credentials: false

      # actions/setup-python v6.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14"

      - name: Install Pixi
        shell: pwsh
        run: |
          iwr -UseBasicParsing https://pixi.sh/install.ps1 | iex
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.pixi\bin"

      - name: Install dependencies
        run: pixi install

      - name: Install actionlint
        shell: pwsh
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "6e7241b51e6817ea6a047693d8e6fed13b31819c9a0dd6c5a726e1592d22f6e9"
        run: |
          $toolDir = Join-Path $env:RUNNER_TEMP "actionlint"
          New-Item -ItemType Directory -Path $toolDir -Force | Out-Null
          $zip = Join-Path $toolDir "actionlint.zip"
          $url = "https://github.com/rhysd/actionlint/releases/download/v$env:ACTIONLINT_VERSION/actionlint_$($env:ACTIONLINT_VERSION)_windows_amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($actual -ne $env:ACTIONLINT_SHA256) {
            throw "actionlint checksum mismatch: $actual"
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $toolDir -Force
          Add-Content -Path $env:GITHUB_PATH -Value $toolDir

      - name: Ruff lint
        run: pixi run lint

      - name: Ruff format
        run: pixi run format-check

      - name: Ty type check
        run: pixi run typecheck

      - name: Typos
        run: pixi run spell

      - name: Zizmor workflow audit
        run: pixi run workflow-audit

      - name: Taplo TOML format
        run: pixi run toml-check

      - name: Actionlint workflow syntax
        run: actionlint -color

      - name: Quality gate configuration
        run: pixi run python scripts\check_quality_gate.py

      - name: Release provenance policy
        run: pixi run python scripts\check_release_provenance_policy.py

      - name: Release version consistency
        run: pixi run python scripts\check_release_version_consistency.py

      - name: Public surface audit
        run: pixi run python scripts\check_public_surface_audit.py

      - name: Zenodo rights metadata
        run: pixi run python scripts\check_zenodo_rights_metadata.py

      - name: Shared NZ corpus core schema
        run: pixi run python scripts\check_shared_core_schema.py

      - name: SOTA metadata packages
        run: pixi run python scripts\check_metadata_packages.py

      - name: OSF optional mirror policy
        run: pixi run python scripts\check_osf_optional_mirror_policy.py

      - name: Multi-git archive mirroring
        run: pixi run python scripts\check_multi_git_archive_mirroring.py

      - name: HathiTrust acquisition inventory
        run: pixi run python scripts\check_hathitrust_acquisition.py

      - name: Parliament website stealth access
        run: pixi run python scripts\check_parliament_website_stealth_access.py

      - name: Wikipedia MP lists acquisition
        run: pixi run python scripts\check_wikipedia_mp_lists_acquisition.py

      - name: Member identity triangulation
        run: pixi run python scripts\check_member_identity_triangulation.py

      - name: Corpus family publication alignment
        run: pixi run python scripts\check_corpus_family_alignment.py

      - name: Corpus family engineering alignment
        run: pixi run python scripts\check_corpus_family_engineering_alignment.py

      - name: Authority source discovery
        run: pixi run python scripts\check_authority_sources.py

      - name: Historical sitting inventory
        run: pixi run python scripts\check_historical_sitting_inventory.py

      - name: Historical sitting official exports
        run: pixi run python scripts\check_historical_sitting_official_exports.py

      - name: Historical sitting official exports coverage
        run: pixi run python scripts\build_historical_sitting_official_exports_coverage.py

      - name: Historical sitting reconciliation
        run: pixi run python scripts\check_historical_sitting_reconciliation.py

      - name: Historical coverage audit
        run: pixi run python scripts\check_historical_coverage_audit.py

      - name: Release ladder
        run: pixi run python scripts\check_release_ladder.py

      - name: Gold evaluation datasets
        run: pixi run python scripts\check_gold_evaluation_datasets.py

      - name: Canonical ID and URI policy
        run: pixi run python scripts\check_canonical_id_uri_policy.py

      - name: Dependency extras policy
        run: pixi run python scripts\check_dependency_extras_policy.py

      - name: NZ parliamentary procedure model
        run: pixi run python scripts\check_nz_parliamentary_procedure_model.py

      - name: Neutral parliamentary component model
        run: pixi run python scripts\check_neutral_component_model.py

      - name: Akoma Ntoso endpoint
        run: pixi run python scripts\check_akoma_ntoso_endpoint.py

      - name: ParlaMint-NZ endpoint
        run: pixi run python scripts\check_parlamint_nz_endpoint.py

      - name: Popolo Open Civic Data endpoint
        run: pixi run python scripts\check_popolo_opencivicdata_endpoint.py

      - name: Universal Dependencies CoNLL-U endpoint
        run: pixi run python scripts\check_ud_conllu_endpoint.py

      - name: RDF Linked Data endpoint
        run: pixi run python scripts\check_rdf_linked_data_endpoint.py

      - name: Derived fields validation manifests
        run: pixi run python scripts\validate_derived_fields.py
