[workspace]
channels = ["conda-forge"]
name = "corpus-nz-hansard"
platforms = ["win-64", "linux-64"]
version = "0.1.0"

[dependencies]
python = "3.14.*"
pip = ">=25.3"

[pypi-dependencies]
duckdb = "==1.5.4"
huggingface-hub = "==1.20.1"
jsonschema = "==4.26.0"
loguru = "==0.7.3"
pdfplumber = "==0.11.10"
polars = "==1.41.2"
pypdf = "==6.13.3"
pyarrow = "==24.0.0"
pydantic = "==2.13.4"
pydantic-settings = "==2.14.2"
requests = "==2.34.2"

[feature.dev.pypi-dependencies]
basedpyright = "==1.39.8"
cyclonedx-py = "==1.0.1"
deptry = "==0.25.1"
detect-secrets = "==1.5.0"
hypothesis = "==6.155.7"
hypothesis-jsonschema = "==0.23.1"
mutmut = "==3.6.0"
pip-audit = "==2.10.1"
pre-commit = "==4.6.0"
pre-commit-hooks = "==6.0.0"
pyinstrument = "==5.1.2"
pyrefly = "==1.1.1"
pytest = "==9.1.1"
pytest-benchmark = "==5.2.3"
pytest-cov = "==7.1.0"
pytest-github-actions-annotate-failures = "==0.4.2"
pytest-randomly = "==4.1.0"
pytest-rerunfailures = "==16.3"
pytest-socket = "==0.8.0"
pytest-timeout = "==2.4.0"
pytest-xdist = "==3.8.0"
ruff = "==0.15.18"
scalene = "==2.3.0"
taplo = "==0.9.3"
ty = "==0.0.51"
typos = "==1.47.2"
vulture = "==2.16"
zizmor = "==1.26.1"

[feature.embeddings.pypi-dependencies]
FlagEmbedding = "==1.4.0"
torch = "==2.12.1"
transformers = "==5.12.1"

[feature.rdf.pypi-dependencies]
rdflib = "==7.6.0"

[feature.nlp.pypi-dependencies]
scikit-learn = "==1.9.0"

[feature.ai.pypi-dependencies]
pydantic-ai-slim = "==1.107.0"

[feature.fast-json.pypi-dependencies]
msgspec = "==0.21.1"
orjson = "==3.11.9"

[feature.xml-models.pypi-dependencies]
xsdata = "==26.2"

[feature.query.pypi-dependencies]
ibis-framework = "==12.0.0"

[feature.search.pypi-dependencies]
tantivy = "==0.26.0"
sqlite-vec = "==0.1.9"

[environments]
default = { features = ["dev", "rdf", "nlp"], solve-group = "default" }
all = { features = [
  "dev",
  "rdf",
  "nlp",
  "ai",
  "fast-json",
  "xml-models",
  "query",
  "search",
], solve-group = "all" }
fast-json = { features = ["fast-json"], solve-group = "default" }
xml-models = { features = ["xml-models"], solve-group = "default" }
query = { features = ["query"], solve-group = "default" }
search = { features = ["search"], solve-group = "search" }
embeddings = { features = ["embeddings"], solve-group = "embeddings" }

[tasks]
lint = ".pixi/envs/default/python.exe -m ruff check --no-cache pyproject.toml pixi.toml test_support.py scripts tests"
format-check = ".pixi/envs/default/python.exe -m ruff format --check --no-cache pyproject.toml pixi.toml test_support.py scripts tests"
test = ".pixi/envs/default/python.exe scripts/run_pytest_with_repo_tmp.py -q"
typecheck = "ty check --error all scripts/build_search_index.py scripts/check_corpus_family_engineering_alignment.py scripts/check_quality_gate.py scripts/select_committee_reports/cache.py tests/test_build_search_index.py tests/test_corpus_family_engineering_alignment.py tests/test_select_committee_reports_cache.py test_support.py"
typecheck-basedpyright = "basedpyright --level error scripts/check_quality_gate.py scripts/select_committee_reports/cache.py tests/test_select_committee_reports_cache.py test_support.py"
typecheck-pyrefly = ".pixi/envs/default/Scripts/pyrefly.exe check --summary=none scripts/build_search_index.py scripts/check_corpus_family_engineering_alignment.py scripts/check_quality_gate.py scripts/select_committee_reports/cache.py tests/test_build_search_index.py tests/test_corpus_family_engineering_alignment.py tests/test_select_committee_reports_cache.py test_support.py"
spell = "typos --config typos.toml"
workflow-audit = "zizmor --min-severity medium .github/workflows"
toml-check = "taplo format --check pyproject.toml pixi.toml typos.toml"
quality-config = ".pixi/envs/default/python.exe scripts/check_quality_gate.py"
learning-log = ".pixi/envs/default/python.exe scripts/check_conductor_learning_log.py"
workflow-syntax = "actionlint -color"
provenance-policy = ".pixi/envs/default/python.exe scripts/check_release_provenance_policy.py"
version-consistency = ".pixi/envs/default/python.exe scripts/check_release_version_consistency.py"
public-surface-audit = ".pixi/envs/default/python.exe scripts/check_public_surface_audit.py"
zenodo-rights = ".pixi/envs/default/python.exe scripts/check_zenodo_rights_metadata.py"
shared-core = ".pixi/envs/default/python.exe scripts/check_shared_core_schema.py"
metadata-packages = ".pixi/envs/default/python.exe scripts/check_metadata_packages.py"
osf-policy = ".pixi/envs/default/python.exe scripts/check_osf_optional_mirror_policy.py"
multi-git-archive-mirroring = ".pixi/envs/default/python.exe scripts/check_multi_git_archive_mirroring.py"
hathitrust-acquisition = ".pixi/envs/default/python.exe scripts/check_hathitrust_acquisition.py"
parliament-stealth-access = ".pixi/envs/default/python.exe scripts/check_parliament_website_stealth_access.py"
wikipedia-mp-lists-acquisition = ".pixi/envs/default/python.exe scripts/check_wikipedia_mp_lists_acquisition.py"
member-identity-triangulation = ".pixi/envs/default/python.exe scripts/check_member_identity_triangulation.py"
corpus-family-alignment = ".pixi/envs/default/python.exe scripts/check_corpus_family_alignment.py"
corpus-family-engineering = ".pixi/envs/default/python.exe scripts/check_corpus_family_engineering_alignment.py"
authority-sources = ".pixi/envs/default/python.exe scripts/check_authority_sources.py"
parliament-dataset-inventory = ".pixi/envs/default/python.exe scripts/check_parliament_dataset_inventory.py"
parliament-dataset-seed-fetchers = ".pixi/envs/default/python.exe scripts/check_parliament_dataset_seed_fetchers.py"
parliament-dataset-full-acquisition = ".pixi/envs/default/python.exe scripts/check_parliament_dataset_full_acquisition.py"
parliament-video-source-inventory = ".pixi/envs/default/python.exe scripts/check_parliament_video_source_inventory.py"
parliament-video-seed-fetchers = ".pixi/envs/default/python.exe scripts/check_parliament_video_seed_fetchers.py"
parliament-video-reconciliation = ".pixi/envs/default/python.exe scripts/check_parliament_video_reconciliation.py"
parliament-video-media-acquisition-decision = ".pixi/envs/default/python.exe scripts/check_parliament_video_media_acquisition_decision.py"
parliament-video-full-metadata-archive = ".pixi/envs/default/python.exe scripts/check_parliament_video_full_metadata_archive.py"
parliament-video-track-plan = ".pixi/envs/default/python.exe scripts/check_parliament_video_track_plan.py"
historical-sitting-inventory = ".pixi/envs/default/python.exe scripts/check_historical_sitting_inventory.py"
historical-sitting-official-exports = ".pixi/envs/default/python.exe scripts/check_historical_sitting_official_exports.py"
historical-sitting-official-exports-coverage = ".pixi/envs/default/python.exe scripts/build_historical_sitting_official_exports_coverage.py"
historical-sitting-reconciliation = ".pixi/envs/default/python.exe scripts/check_historical_sitting_reconciliation.py"
historical-coverage = ".pixi/envs/default/python.exe scripts/check_historical_coverage_audit.py"
release-ladder = ".pixi/envs/default/python.exe scripts/check_release_ladder.py"
gold-evaluation = ".pixi/envs/default/python.exe scripts/check_gold_evaluation_datasets.py"
canonical-ids = ".pixi/envs/default/python.exe scripts/check_canonical_id_uri_policy.py"
dependency-extras = ".pixi/envs/default/python.exe scripts/check_dependency_extras_policy.py"
procedure-model = ".pixi/envs/default/python.exe scripts/check_nz_parliamentary_procedure_model.py"
neutral-components = ".pixi/envs/default/python.exe scripts/check_neutral_component_model.py"
akoma-ntoso = ".pixi/envs/default/python.exe scripts/check_akoma_ntoso_endpoint.py"
parlamint-nz = ".pixi/envs/default/python.exe scripts/check_parlamint_nz_endpoint.py"
popolo-ocd = ".pixi/envs/default/python.exe scripts/check_popolo_opencivicdata_endpoint.py"
ud-conllu = ".pixi/envs/default/python.exe scripts/check_ud_conllu_endpoint.py"
rdf-linked-data = ".pixi/envs/default/python.exe scripts/check_rdf_linked_data_endpoint.py"
corpus-wide-member-identity = ".pixi/envs/default/python.exe scripts/check_corpus_wide_member_identity.py"
corpus-wide-party-attribution = ".pixi/envs/default/python.exe scripts/check_corpus_wide_party_attribution.py"
validated-speech-turn = ".pixi/envs/default/python.exe scripts/check_validated_speech_turn_component.py"
derived-fields-validation = ".pixi/envs/default/python.exe scripts/validate_derived_fields.py"
security-audit = ".pixi/envs/default/python.exe -m pip_audit --strict --cache-dir .tmp/pip-audit-cache --progress-spinner off"
sbom = "cyclonedx-py environment --output-file reports/sbom.cdx.json"
dependency-check = ".pixi/envs/default/Scripts/deptry.exe tests --exclude venv --exclude \\.venv --exclude \\.git --ignore DEP001,DEP002 --known-first-party scripts --known-first-party test_support --package-module-name-map FlagEmbedding=flagembedding,torch=torch,transformers=transformers,pydantic-ai-slim=pydantic_ai,msgspec=msgspec,orjson=orjson,xsdata=xsdata,ibis-framework=ibis,tantivy=tantivy,sqlite-vec=sqlite_vec --no-ansi"
dead-code = ".pixi/envs/default/Scripts/vulture.exe scripts/build_search_index.py scripts/check_quality_gate.py scripts/select_committee_reports/cache.py tests/test_build_search_index.py tests/test_select_committee_reports_cache.py test_support.py --min-confidence 80"
test-offline = ".pixi/envs/default/python.exe scripts/run_pytest_with_repo_tmp.py -q --disable-socket"
benchmark = ".pixi/envs/default/python.exe scripts/run_pytest_with_repo_tmp.py -q tests/test_performance_benchmarks.py"
profile-search-index = ".pixi/envs/default/python.exe -m pyinstrument --outfile .tmp/search-index-profile.html scripts/run_pytest_with_repo_tmp.py -q tests/test_build_search_index.py"
mutation-smoke = ".pixi/envs/default/python.exe scripts/run_mutation_smoke.py"
quality = { depends-on = [
  "lint",
  "format-check",
  "typecheck",
  "spell",
  "workflow-audit",
  "toml-check",
  "workflow-syntax",
  "quality-config",
  "learning-log",
  "provenance-policy",
  "version-consistency",
  "public-surface-audit",
  "zenodo-rights",
  "shared-core",
  "metadata-packages",
  "osf-policy",
  "multi-git-archive-mirroring",
  "hathitrust-acquisition",
  "parliament-stealth-access",
  "wikipedia-mp-lists-acquisition",
  "member-identity-triangulation",
  "corpus-family-alignment",
  "corpus-family-engineering",
  "authority-sources",
  "parliament-dataset-inventory",
  "parliament-dataset-seed-fetchers",
  "parliament-dataset-full-acquisition",
  "parliament-video-source-inventory",
  "parliament-video-seed-fetchers",
  "parliament-video-reconciliation",
  "parliament-video-media-acquisition-decision",
  "parliament-video-full-metadata-archive",
  "parliament-video-track-plan",
  "historical-sitting-inventory",
  "historical-sitting-official-exports",
  "historical-sitting-official-exports-coverage",
  "historical-sitting-reconciliation",
  "historical-coverage",
  "release-ladder",
  "gold-evaluation",
  "canonical-ids",
  "dependency-extras",
  "procedure-model",
  "neutral-components",
  "akoma-ntoso",
  "parlamint-nz",
  "popolo-ocd",
  "ud-conllu",
  "rdf-linked-data",
  "corpus-wide-member-identity",
  "corpus-wide-party-attribution",
  "validated-speech-turn",
  "derived-fields-validation",
  "test",
] }
